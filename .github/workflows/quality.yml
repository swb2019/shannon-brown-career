name: Portfolio quality
on:
  pull_request:
  push:
    branches: [main, feat/security-leadership-presence]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build && npm run check
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test
      - name: Five-run mobile performance qualification
        run: node scripts/lighthouse.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-quality-evidence
          path: qa-output/
          retention-days: 14
