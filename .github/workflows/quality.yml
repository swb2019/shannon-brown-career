name: Portfolio quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build && npm run check
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-quality-evidence
          path: qa-output/
          retention-days: 14
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        device: [mobile, desktop]
        page: [home, about, notes, outage, briefing, hourglass, practice, privacy]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Five cold runs for this route and device class
        env:
          PERF_DEVICE: ${{ matrix.device }}
          PAGE: ${{ matrix.page }}
        run: |
          case "$PAGE" in
            home) export PERF_ROUTE='' ;;
            about) export PERF_ROUTE='about/' ;;
            notes) export PERF_ROUTE='notes/' ;;
            outage) export PERF_ROUTE='notes/security-system-outage/' ;;
            briefing) export PERF_ROUTE='notes/briefing-before-certainty/' ;;
            hourglass) export PERF_ROUTE='work/hourglass-command/' ;;
            practice) export PERF_ROUTE='practice/decision-brief/' ;;
            privacy) export PERF_ROUTE='privacy/' ;;
          esac
          node scripts/lighthouse.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-${{ matrix.device }}-${{ matrix.page }}
          path: qa-output/lighthouse/
          retention-days: 14
